name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: demo-judge (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 全部演示判据（duy_mini.exe）
        run: python run_all.py

      - name: 原件 doctest（各演示的判据有效性）
        run: |
          foreach ($f in Get-ChildItem demos/*/original/*.py) {
            Write-Host "== $($f.Name)"
            python -m doctest $f.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
